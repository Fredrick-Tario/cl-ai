[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cl-ai"
version = "0.1.0"
description = "A terminal-first conversational DevOps and SRE assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=0.3",
    "prompt-toolkit>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cl-ai = "cl_ai.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/cl_ai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

